* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.dl-app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0e1420; color: #e6ebf2;
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", system-ui, sans-serif; padding-bottom: 72px; }

.dl-muted { color: #a6b3c6; }
.dl-row { display: flex; align-items: center; justify-content: space-between; }
.dl-unit { font-size: 10px; color: #8a97ab; margin-left: 2px; font-weight: 400; }

.dl-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: #0e1420ee; backdrop-filter: blur(8px); border-bottom: 1px solid #1c2740; }
.dl-title { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
.dl-ver { font-size: 10px; font-weight: 600; color: #6f7f96; margin-left: 6px; vertical-align: middle; }

.dl-txfwarn { margin-top: 4px; font-size: 11px; color: #e8a33d; line-height: 1.5; }

/* v3.64 header 常駐快捷 */
.dl-titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dl-quick { display: flex; gap: 4px; }
/* v3.65：三個都常駐金橘粗體。原本用字色區分選中，改成金色後字色不能再兼任狀態，
   選中改由底色＋邊框表示（字色三個一致，才不會有「哪個是可按的」這種誤讀）。 */
.dl-qb { background: #16203a; color: #d4a544; border: 1px solid #23324f; border-radius: 999px;
  padding: 3px 9px; font-size: 11px; font-weight: 800; }
.dl-qb.on { background: #3a2c12; border-color: #d4a544; }

/* v3.65b 今日分析追問 */
.dl-anachat { margin-top: 10px; border-top: 1px solid #1e2b45; padding-top: 10px; }
.dl-anaturn { margin-bottom: 10px; }
.dl-anaq { background: #16203a; border-left: 3px solid #d4a544; border-radius: 0 8px 8px 0;
  padding: 7px 10px; font-size: 13px; font-weight: 600; color: #e8eef8; }.dl-anain { width: 100%; box-sizing: border-box; background: #0f1728; color: #e8eef8;
  border: 1px solid #23324f; border-radius: 10px; padding: 8px 10px; font-size: 13px;
  font-family: inherit; resize: vertical; }

/* v3.65b 換算輸入框與完成鍵 */
.dl-fxinwrap { display: flex; align-items: center; gap: 6px; flex: 1; }
.dl-fxdone { background: #d4a544; color: #17202f; border: none; border-radius: 8px;
  padding: 6px 11px; font-size: 12px; font-weight: 800; flex: none; }

/* v3.65 資料時間標記 */
.dl-stamp { margin-left: 8px; font-size: 10.5px; font-weight: 600; color: #93a3bb; }
.dl-stamp.old { color: #e0a75e; }

/* v3.65 換算頁趨勢敘述 */
.dl-fxtrend { background: #101a2c; border: 1px solid #1e2b45; border-radius: 10px;
  padding: 9px 11px; margin-top: 8px; }
.dl-fxtrendl { font-size: 10.5px; color: #7f92ad; }
.dl-fxtrendv { font-size: 15px; font-weight: 800; }
.dl-fxtrendm { font-size: 11px; color: #9fb2cc; margin-top: 6px;
  border-top: 1px solid #1e2b45; padding-top: 6px; }

/* v3.64 貨幣換算 */
.dl-fxrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #1a2338; }
.dl-fxrow.on { background: #131d31; border-radius: 8px; padding-left: 8px; padding-right: 8px; }

  padding: 0; min-width: 66px; }
.dl-fxlbl { font-size: 14px; font-weight: 800; color: #e6eefb; }
.dl-fxname { font-size: 10px; color: #6f8bab; }
.dl-fxin { flex: 1; background: #0b1729; border: 1px solid #2f5c96; border-radius: 8px; color: #fff;
  font-size: 19px; font-weight: 700; text-align: right; padding: 8px 10px; width: 100%; }
.dl-fxval { flex: 1; background: none; border: none; color: #cfe0f7; font-size: 19px; font-weight: 600;
  text-align: right; padding: 8px 10px; }

  font-size: 13px; color: #9fb2cc; }
.dl-fxcmp b { color: #e6eefb; font-size: 15px; }

/* v3.60 冷靜期卡：藍冷色，與自我提醒的金色、警示的紅色都區隔開 */
.dl-cool { background: #10203a; border: 1px solid #2f5c96; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.dl-coolhd { display: flex; align-items: baseline; gap: 4px; }
.dl-coolday { font-size: 34px; font-weight: 800; color: #7fb2ff; line-height: 1; }
.dl-cooldayu { font-size: 14px; color: #7fb2ff; margin-right: 8px; }
.dl-coolttl { font-size: 14px; font-weight: 700; color: #cfe0f7; }
.dl-coolmeta { font-size: 11px; color: #7b8ea8; margin-top: 6px; }
.dl-coolrsn { margin-top: 10px; background: #0b1729; border-left: 3px solid #2f5c96; border-radius: 6px; padding: 9px 11px; }
.dl-coolrsnl { font-size: 10px; color: #6f8bab; margin-bottom: 4px; }
.dl-coolrsnt { font-size: 14px; color: #e6eefb; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.dl-coolend { margin-top: 10px; width: 100%; background: transparent; color: #6f8bab; border: 1px solid #26405f; border-radius: 8px; padding: 7px; font-size: 12px; }
.dl-coolstart { margin-top: 10px; width: 100%; background: #16283f; color: #9cc3f5; border: 1px solid #2f5c96; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; }

/* v3.60 收合摘要與分析過期標記 */
.dl-sectsub { font-size: 11px; color: #7b8ea8; margin-top: 4px; padding-left: 18px; }
.dl-stale { color: #e8a33d; font-weight: 600; }
.dl-stalebar { background: #2e2410; border: 1px solid #6b5220; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #e8c78d; line-height: 1.5; margin-bottom: 8px; }
.dl-margin { background: #0f1826; border: 1px solid #22304a; border-radius: 11px; padding: 10px 12px 2px; margin-bottom: 11px; }
.dl-mtag { font-size: 10px; font-weight: 700; color: #e6b84a; background: #33290f; border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.dl-verline { text-align: center; color: #4f5d74; font-size: 11px; margin-top: 14px; }

.dl-sub { font-size: 11px; color: #8a97ab; margin-top: 1px; }

.dl-heroTop { display: flex; justify-content: space-between; align-items: flex-start; }
