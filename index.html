<div id="root"></div>
<!-- ===== App 4.55 前置腳本：把估值管制圖的三情境交給今日分析 ==============
     為什麼：三情境算在估值管制圖（localStorage yg_blend_v2），但 ygAnalyze_
     完全不知道它們存在，所以今日分析只講得出 Known-TTM 37.36，講不出
     「就算樂觀情境也還在 P90 以上」。這是材料缺席，不是紀律問題。
     ★單一真實來源：數字只存在 localStorage，後端不另存一份，避免兩邊各改各的。
     ★分位帶用凍結的 benchmark v1 乾淨樣本分位數，與圖上完全一致。
     沒填就回 null，後端整段不輸出。 -->
<script>
window.ygFwdPayload_ = function () {
  try {
    var b = JSON.parse(localStorage.getItem('yg_blend_v2') || 'null');
    if (!b) return null;
    var a1 = Number(b.a1), a2 = Number(b.a2);
    if (!isFinite(a1) || !isFinite(a2) || !a1 || !a2) return null;
    var act = a1 + a2;
    var Q = (window.__YG_PE_BENCH__ && window.__YG_PE_BENCH__.quantiles_clean) || null;
    var CUR = (window.__YG_PE_BENCH__ && window.__YG_PE_BENCH__.current) || null;
    if (!Q || !CUR) return null;
    function band(pe) {
      if (pe >= Q.P95) return '高於 P95（' + Q.P95 + '）';
      if (pe >= Q.P90) return 'P90–P95（' + Q.P90 + '–' + Q.P95 + '）';
      if (pe >= Q.P75) return 'P75–P90（' + Q.P75 + '–' + Q.P90 + '）';
      if (pe >= Q.P50) return 'P50–P75（' + Q.P50 + '–' + Q.P75 + '）';
      if (pe >= Q.P25) return 'P25–P50（' + Q.P25 + '–' + Q.P50 + '）';
      return '低於 P25（' + Q.P25 + '）';
    }
    /* v4.61 B6.1：Forward PE 的分母改用最新市場價；抓不到才退回基準價，
       並如實在 priceAsOf 標明用的是哪一個，不假裝是現價。 */
    var PX = Number(CUR.native), PXSRC = 'benchmark 基準價 · ' + String(CUR.date || '');
    try {
      var mk = JSON.parse(localStorage.getItem('dl_market') || '{}');
      var mq = mk && (mk['2327.TW'] || mk['2327']);
      var lv = mq && Number(mq.price != null ? mq.price : mq.close);
      if (isFinite(lv) && lv > 0) {
        PX = lv;
        PXSRC = '最新市場價' + (mq && mq.time ? ' · ' + String(mq.time) : '');
      }
    } catch (ePx) {}
    var NM = { sc: '保守', base: '基準', op: '樂觀' }, out = [];
    ['sc', 'base', 'op'].forEach(function (k) {
      var g = b[k] || {}, e1 = Number(g.e1), e2 = Number(g.e2);
      if (!isFinite(e1) || !e1 || !isFinite(e2) || !e2) return;
      var eps = Math.round((act + e1 + e2) * 100) / 100;
      /* v4.61 B6.1：pe 一律是「現價 Forward PE」；基準日那一種另外用 peBench 帶，
         不再讓同一個欄位扮演兩種意思。band 依現價 pe 判定。 */
      var pe = Math.round(PX / eps * 100) / 100;
      var peBench = Math.round(CUR.native / eps * 100) / 100;
      out.push({ name: NM[k], e1: e1, e2: e2, eps: eps, pe: pe, peBench: peBench, band: band(pe) });
    });
    if (!out.length) return null;
    return {
      label: b.label || '', actualSum: Math.round(act * 100) / 100,
      actualNote: '已公布實績，' + (b.label || '') + ' 前兩季',
      native: CUR.native,
      priceUsed: PX, priceAsOf: PXSRC,
      benchNative: CUR.native, benchDate: String(CUR.date || ''),
      scenarios: out,
      benchNote: 'benchmark ' + (window.__YG_PE_BENCH__.benchmarkVersion || 'v1') + ' 乾淨樣本分位數'
    };
  } catch (e) { return null; }
};
</script>
<!-- ===== C31（App 4.90）按鈕按壓回饋 ==================================
     問題不是介面不美觀，是這一輪反覆踩到的同一件事：動作與結果之間沒有立即回饋。
     實際發生過四次「按了但看不出有沒有作用」——部署後忘了重跑、按錯同名的載入鈕、
     apply 回報成功但被儲存格格式擋掉、偵測器報 0 格卻確實修好了。
     共同形狀都是「要事後查版本號／查留痕／再跑一次 dry-run」才知道剛才那一下有沒有效。
     ★做法：委派監聽，不逐顆改 bundle 裡的按鈕（那要動幾十處，風險不成比例）。
       document 上一個 capture 階段的 pointerdown，涵蓋全部按鈕，
       React 重新渲染也不會失效（監聽掛在 document 不是元素上）。
     ★只做「按壓被接收到」這件事，不假裝知道非同步動作何時完成——
       那需要逐顆知道它在做什麼，會變成猜。停在能誠實回答的範圍。
     ★移除方式：刪掉這整個區塊即可，bundle 完全沒有依賴它。 -->
<script>
(function () {
  var CSS = '@keyframes dlTapPulse{0%{box-shadow:0 0 0 0 rgba(122,162,247,.55)}'
          + '100%{box-shadow:0 0 0 10px rgba(122,162,247,0)}}'
          + '.dl-tapped{animation:dlTapPulse .45s ease-out;'
          + 'filter:brightness(1.35);transition:filter .12s}';
  try {
    var st = document.createElement('style');
    st.setAttribute('data-dl', 'c31');
    st.appendChild(document.createTextNode(CSS));
    (document.head || document.documentElement).appendChild(st);
  } catch (e) { return; }

  function flash(el) {
    if (!el || el.disabled) return;          /* 停用中的按鈕本來就不該有回饋 */
    el.classList.remove('dl-tapped');
    void el.offsetWidth;                     /* 強制重排，連點兩次才會重新播 */
    el.classList.add('dl-tapped');
    setTimeout(function () { el.classList.remove('dl-tapped'); }, 470);
  }

  document.addEventListener('pointerdown', function (ev) {
    var el = ev.target;
    for (var i = 0; el && i < 4; i++) {      /* 往上找幾層：按鈕內常包 span／emoji */
      if (el.tagName === 'BUTTON') { flash(el); return; }
      el = el.parentElement;
    }
  }, true);
})();
</script>
<!-- ===== C23（App 4.89）資券頁共用 X 軸 domain ==========================
     為什麼放在 bundle 外：Il 的 x 範圍原本各圖自算（z=min(x)、O=max(x)），
     五張圖的資料長度不同，橫軸尺度就差到七倍，上下疊放根本無法對照。
     這裡只提供「聯集範圍」這個純計算，bundle 內僅新增一個 xDom prop 與四處傳參，
     邏輯本身不進壓縮碼 —— 改壞了刪掉這個區塊即可回到原行為（xDom 為 null 時 Il 走舊路徑）。
     ★短資料留空不補、不截：Il 只是把 x 映射到寬度，沒有資料的區段本來就不畫線。
       這是刻意的 —— 法人資料只有 38/140 天，截短會讓五張圖看起來一樣完整，實際上不是。
     ★必須放在 bundle 之前：呼叫發生在 render 時，但先定義比較不必推敲載入順序。 -->
<script>
(function () {
  var memoKey = null, memoVal = null;
  function scan(arr, acc) {
    if (!arr || !arr.length) return;
    for (var i = 0; i < arr.length; i++) {
      var x = arr[i] && arr[i].x;
      if (typeof x !== 'number' || !isFinite(x)) continue;
      if (acc.lo === null || x < acc.lo) acc.lo = x;
      if (acc.hi === null || x > acc.hi) acc.hi = x;
    }
  }
  /* 傳入資券頁那個資料組，回傳 {lo,hi}；算不出來回 null（Il 收到 null 就維持原本各自算的行為）。 */
  window.ygXDomI_ = function (I) {
    if (!I) return null;
    if (memoKey === I) return memoVal;              /* 同一次 render 四張圖共用，不重算四遍 */
    var acc = { lo: null, hi: null };
    ['close', 'borrow', 'marginBal', 'shortBal', 'shortRatio', 'mainNet', 'inst', 'marginCum']
      .forEach(function (k) { scan(I[k], acc); });
    memoKey = I;
    memoVal = (acc.lo !== null && acc.hi !== null && acc.lo < acc.hi) ? { lo: acc.lo, hi: acc.hi } : null;
    return memoVal;
  };
})();
</script>
<!-- ===== App 4.42 前置腳本：日股三檔一次性種子 ==========================
     為什麼需要這段：bu（預設清單）只在「這台裝置從來沒存過 dl_marketsyms」時生效。
     已經在用的裝置讀的是 localStorage，改 bu 對它完全沒有作用；而既有的遷移函式
     一看到 dl_mkedited（使用者編輯過市場清單）就整個 return，也不會補。
     所以這裡用自己的旗標 dl_jp_seed_v1 做一次性插入，插在最後一檔 .TW 之後
     ——與 bu 的位置一致，不追加到清單尾巴。
     ★必須放在 bundle 之前：React 是在 bundle 執行時就用 localStorage 的值初始化 state，
       放在後面寫入會慢一步，要重開 App 才看得到。
     已存在的代號不重複加；使用者事後自己刪掉也不會被這段補回來（旗標已立）。
     移除方式：刪掉這整個 <script> 區塊，並清掉 localStorage 的 dl_jp_seed_v1。 -->
<script>
(function () {
  var KEY = 'dl_marketsyms', FLAG = 'dl_jp_seed_v1';
  var JP = [
    { sym: '6981.T', name: '\u6751\u7530\u88FD\u4F5C\u6240' },
    { sym: '6976.T', name: '\u592A\u967D\u8A98\u96FB' },
    { sym: '6762.T', name: 'TDK' }
  ];
  try {
    if (localStorage.getItem(FLAG)) return;
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) {
        var have = {};
        for (var i = 0; i < list.length; i++) {
          var sy = list[i] && list[i].sym;
          if (sy) have[String(sy).toUpperCase()] = 1;
        }
        var add = JP.filter(function (x) { return !have[x.sym.toUpperCase()]; });
        if (add.length) {
          /* 插在最後一檔台股之後；找不到台股就放最前面（而不是尾巴）。 */
          var at = -1;
          for (var k = 0; k < list.length; k++) {
            var t = String((list[k] && list[k].sym) || '').toUpperCase();
            if (t.indexOf('.TW') >= 0) at = k;
          }
          /* ★不可寫成 splice(at+1,0,add[0],add[1],add[2])：
             若使用者已自行加過其中一檔，add 不足 3 個，多出來的會塞進 undefined，
             序列化後變成 null，畫面就多出一列空白。用 apply 展開才對長度中立。 */
          list.splice.apply(list, [at + 1, 0].concat(add));
          localStorage.setItem(KEY, JSON.stringify(list));
        }
      }
    }
    localStorage.setItem(FLAG, '1');
  } catch (e) { /* localStorage 不可用就什麼都不做，不影響 App 啟動 */ }
})();
</script>

<!-- ===== App 4.42 外掛：族群波段頁入口 =========================================
     為什麼是外掛而不是改元件：前端 src/*.jsx 從未進版控，只有 minified bundle，
     無法重新編譯。這段是獨立的原生 JS，掛在 bundle 之後，不與 React 互動
     （按鈕掛在 body 上、不在 React root 內，重繪不會影響它）。
     網址與 token 從 localStorage['dl_settings'] 讀取——與 App 用的是同一組設定，
     不另存一份，避免兩處設定不同步。
     移除方式：把這整個 <script> 區塊刪掉即可，bundle 完全未被更動。 -->
<script>
(function () {
  var SETTINGS_KEY = 'dl_settings';
  function readSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function buildUrl() {
    var s = readSettings();
    var url = String(s.gasUrl || '').trim();
    var tok = String(s.appToken || '').trim();
    if (!url || !tok) return null;
    return url + (url.indexOf('?') >= 0 ? '&' : '?')
      + 'token=' + encodeURIComponent(tok) + '&view=peers';
  }
  function open() {
    var u = buildUrl();
    if (!u) { alert('請先到設定頁填入 GAS 網址與 App Token，這個頁面才知道要連到哪裡。'); return; }
    window.open(u, '_blank', 'noopener');
  }
  function mount() {
    /* 4.47：改掛在 4.44 估值外掛建立的頂部橫排上（原本是右緣直向浮籤，會壓到漲跌幅欄位）。
       估值那段先執行並定義 window.__ygTopBar；萬一沒有就退回原本的浮籤，不讓按鈕整個消失。 */
    if (document.getElementById('yg-peer-tab')) return;
    if (typeof window.__ygTopBar === 'function') {
      window.__ygTopBar([{ id: 'yg-peer-tab', text: '族群', color: '#ffd166',
        label: '開啟被動元件族群波段頁', onClick: open }]);
      return;
    }
    var b = document.createElement('button');
    b.id = 'yg-peer-tab';
    b.type = 'button';
    b.textContent = '族群';
    b.setAttribute('aria-label', '開啟被動元件族群波段頁');
    b.style.cssText = [
      'position:fixed', 'right:0', 'top:38%', 'z-index:2147483000',
      'writing-mode:vertical-rl', 'text-orientation:upright', 'letter-spacing:2px',
      'padding:12px 5px', 'border:1px solid #25384f', 'border-right:none',
      'border-radius:9px 0 0 9px', 'background:#132238', 'color:#ffd166',

      'box-shadow:-2px 2px 10px rgba(0,0,0,.45)', 'cursor:pointer',
      'opacity:.92', '-webkit-tap-highlight-color:transparent'
    ].join(';');
    b.addEventListener('click', open);
    document.body.appendChild(b);
  }
  /* 4.47：__ygTopBar 由排在後面的估值外掛定義，所以這裡要等一拍。
     最多重試 20 次（約 1 秒），逾時就用原本的右緣浮籤，不讓按鈕消失。 */
  var tries = 0;
  function boot() {
    if (typeof window.__ygTopBar === 'function' || tries++ > 20) { mount(); return; }

  } else { boot(); }

  /* B7：預估列的百分位。只報分位帶，不報單一數字 —— 手上只有 P5..P95 六個點，

  function ygVcBand_(pe) {

    if (pe >= Q.P75) return 'P75–P90';

  /* ★C38 前半（4.97）：預設改成【近 1 年 ＋ 對數】。

     ⚠ 只改初始值，四個期間鈕與對數鈕都還在，按了照常切換。
     ⚠ clean（乾淨樣本）維持 true 不動 —— 那一顆牽涉百分位用哪一組分位數，
       改它會連帶改動 P50/P90 這些線的位置，不是單純的視角切換。 */
  var state = { span: 1, log: true, clean: true, hover: -1 };
  var SPANS = [[0, '全期'], [5, '近5年'], [3, '近3年'], [1, '近1年']];

  function qs() { return state.clean ? Q : QA; }

  /* ---------- 繪圖 ---------- */
  var cv, ctx, geo = null;

  function draw() {
    if (!cv) return;

        W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var PL = 34, PR = 10, PT = 10, PB = 20;
    var w = W - PL - PR, h = H - PT - PB;

    var lo = Math.min(3, q.P5 * 0.85), hi = Math.max(q.P95 * 1.15, CUR.pe * 1.1), i;
    for (i = 0; i < data.length; i++) {
      if (data[i].pe < lo) lo = data[i].pe;
      if (data[i].pe > hi) hi = data[i].pe;
    }
    lo = Math.max(2, lo * 0.95); hi = hi * 1.05;

    var t0 = data[0].t, t1 = data[data.length - 1].t;
    function X(t) { return PL + (t - t0) / (t1 - t0) * w; }
    function Y(v) {
      if (state.log) {
        var a = Math.log(lo), b = Math.log(hi);
        return PT + h - (Math.log(Math.max(v, lo)) - a) / (b - a) * h;
      }

    function band(a, b, col) {
      ctx.fillStyle = col;
      ctx.fillRect(PL, Y(b), w, Y(a) - Y(b));

    band(q.P25, q.P75, 'rgba(122,162,247,.13)');
    band(q.P75, q.P90, 'rgba(232,163,61,.10)');
    band(q.P90, hi, 'rgba(255,91,91,.10)');

    /* 線性刻度下 P25/P50 會擠在一起，標籤直接疊字（對數時不會）。
       這裡記住上一個標籤的 y，太近就往右退一格放，寧可錯開也不要疊。 */

      for (i = 0; i < labSlots.length; i++) {

      }
      labSlots.push({ y: y, c: col2 });

    hline(q.P90, '#e8a33d', [2, 3], 'P90');

    hline(q.P50, '#cfe0f7', [], 'P50');
    hline(q.P25, '#7aa2f7', [4, 3], 'P25');
    hline(q.P5, '#22c55e', [1, 3], 'P5');

    /* Y 軸刻度 */
    ctx.fillStyle = '#6c7d97'; ctx.font = '9px system-ui,sans-serif'; ctx.textAlign = 'right';
    var ticks = state.log ? [3, 5, 8, 13, 20, 30, 50, 80] : null;
    if (!ticks) { ticks = []; for (i = 0; i <= 5; i++) ticks.push(lo + (hi - lo) * i / 5); }
    ticks.forEach(function (v) { if (v >= lo && v <= hi) ctx.fillText(n1(v), PL - 4, Y(v) + 3); });

    /* X 軸刻度：區間越短、粒度越細。近 1 年只畫年線等於沒有時間座標。

    ctx.textAlign = 'center';

    var mStep = yrs > 7 ? 24 : (yrs > 4 ? 12 : (yrs > 2 ? 6 : (yrs > 1.2 ? 3 : 1)));
    var d0 = new Date(t0), cy = d0.getUTCFullYear(), cm = d0.getUTCMonth();

      var on = false;

        if (pred(data[i].f)) {

          else ctx.lineTo(X(data[i].t), Y(data[i].pe));

      }
      ctx.stroke();

    seg(function (f) { return f !== 'o' && f !== 'e'; }, '#4b5a72', 1);
    seg(function (f) { return f === 'o' || f === 'e'; }, '#e6eefb', 1.3);

    /* 現況點 */

    var scs = scList(loadBlend()), si, sLastY = -999;

  }

      function place() {

        document.documentElement.style.setProperty('--yg-topbar-h', '0px');
      }
      place();
      if (window.ResizeObserver && header) { try { new ResizeObserver(place).observe(header); } catch (e) {} }

      window.addEventListener('resize', place);

        'background:#132238', 'color:' + (it.color || '#7aa2f7'),
        'font:inherit', 'cursor:pointer', '-webkit-tap-highlight-color:transparent'

      b.addEventListener('click', it.onClick);
      bar.appendChild(b);
    });

  };

})();

  var SOURCES = ['券商畫面－使用者抄錄', '券商畫面－ChatGPT代抄', 'App資料', '自行計算', '未查證'];
  var SOURCE_SHORT = { '券商畫面－使用者抄錄': '親抄', '券商畫面－ChatGPT代抄': '代抄',

  var C = { g: '#3ecf8e', r: '#ff5b5b', y: '#e8a33d', m: '#93a4c0', line: '#26324a', bg: '#131c2c' };

  var pasteOpen = false, pasteText = '', pasteMsg = '', pasteQueue = [];

  function st() { try { return JSON.parse(localStorage.getItem('dl_settings') || '{}') || {}; } catch (e) { return {}; } }
  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  /* ★v1.5（4.93）日期與時間一律用【台灣時間】，不看裝置所在地。
     使用者在越南（UTC+7）與台灣（UTC+8）之間往返：人在越南時，
     台股 10:00 的盤面按下去會填成 09:00，存進去畫面上完全正常 ——
     又是一個安靜的錯，而且事後分不出是時區還是補記。
     盤中觀察記的是台股盤面，時間只能有一種解釋：台灣時間。
     ⚠ 用 getTimezoneOffset() 反推，不依賴任何外部時間來源；
       裝置時鐘本身若不準，這裡也救不了（那要靠下面的合理區間提示）。 */
  function twNow() {
    var d = new Date();
    return new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
  }
  function today() {
    var d = twNow();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function hhmm() {
    var d = twNow();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  /* 裝置與台灣的時差（小時），只用來在畫面上說明，不參與計算 */
  function tzGapHr() { return Math.round((-new Date().getTimezoneOffset() - 480) / 60); }

  /* C20（4.88）：Sheets 會把寫入的 'HH:MM' 字串自動轉成 Date，讀回來就變成
     1899-12-30 系列（serial epoch 0）。只在讀取端正規化，不改資料、不回寫。
     為何不硬解 '1899-12-30' 這種只剩日期的值：時間已經在往返中遺失，
     new Date('1899-12-30') 會給出 UTC 午夜再偏移成本地 08:00，那是編造。寧可留空。
     ★ 只有 8/27 一筆壞掉、其餘四筆正常，成因尚未查明，這裡是止血不是根治。 */
  function normTime(v) {
    if (v == null) return '';
    var s = String(v);
    if (/^\d{1,2}:\d{2}$/.test(s)) return ('0' + s).slice(-5);
    if (s.indexOf(':') < 0) return '';
    var d = new Date(s);
    if (!isNaN(d.getTime()))
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var m = s.match(/(\d{1,2}):(\d{2})/);
    return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
  }

  /* C21（4.88）：補記與編輯過的紀錄沒有當下 snapshot——snapshot() 對
     form.id 與 backdated 一律回傳 {}，那是刻意的，補記時不該編造當時行情。
     價格事實可由 2327_daily 重建，所以改成讀取時計算，不寫回 observation：
       ① 寫回去會讓日後看的人以為這是記錄當下就存在的資訊
       ② daily 日後若修正，畫面自動跟著對，不會出現 observation 與 daily 兩份真相
     只回填國巨自己的收盤與漲跌幅。dl_ygdata 沒有族群與大盤的歷史，那兩項維持空白。 */
  function dailyOf(date) {
    var yg = null;
    try { yg = JSON.parse(localStorage.getItem('dl_ygdata') || 'null'); } catch (e) { return null; }
    if (!yg || !Array.isArray(yg.daily)) return null;
    var key = String(date || '').slice(0, 10);
    if (!key) return null;
    for (var i = 0; i < yg.daily.length; i++) {
      var d = yg.daily[i] || {};
      if (String(d.date || '').slice(0, 10) === key) return d;
    }
    return null;
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : null; }

  /* 「部分成立」守門：原假設必須先寫下可對照的幅度或時間條件，否則這個選項停用。
     否則它會變成模糊緩衝區 —— 半年後做命中率時，分不出「真的部分成立」與「不想承認失敗」。
     偵測對象：價位/百分點/張數等數值，或分鐘、時刻、開收盤等時間表述。 */
  function hasMeasurable(hyp) {
    var t = String(hyp || '');
    if (!t) return false;
    if (/\d+\s*(分鐘|分|小時|天|日|根K|根)/.test(t)) return true;
    if (/\d{1,2}:\d{2}/.test(t)) return true;
    if (/(開盤|收盤|尾盤|早盤|午盤|盤中|隔日|次日)/.test(t) && /\d/.test(t)) return true;
    if (/\d+(\.\d+)?\s*(%|％|pp|元|張|檔)/.test(t)) return true;
    if (/\d{3,}/.test(t)) return true;          /* 三位數以上多半是價位，如 555 / 610 */
    return false;
  }

  function blank() {
    return {
      id: '', date: today(), timestamp: hhmm(),
      bias: '不明', tags: [], observation: '', hypothesis: '',
      tradeType: '', tradeSide: '', tradePrice: '', tradeQty: '', tradeNote: '',
      resultStatus: '待驗證', resultNote: '', source: ''
    };
  }

  /* ---- 貼上解析 ----------------------------------------------------------
     吃 ChatGPT 依固定格式產生的七欄文字，一次可含多筆（以 日期： 或 時間： 起新的一筆）。
     ★設計原則：認不得的值【不靜默丟掉】，一律列進 warn 讓使用者看見。
       靜默丟值會讓畫面看起來填好了、其實少了東西，那比解析失敗更難發現。 */
  var FIELD_MAP = {
    '日期': 'date', '時間': 'timestamp', '現象': 'observation',
    '盤勢判斷': 'bias', '觀察類型': 'tags', '待驗證假設': 'hypothesis',
    '操作事件': 'tradeType', '數字來源': 'source'
  };
  function parsePaste(txt) {
    var lines = String(txt || '').split(/\r?\n/);
    var recs = [], cur = null, lastKey = '', warn = [];
    function flush() { if (cur && String(cur._raw.observation || '').trim()) recs.push(cur); cur = null; }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var m = ln.match(/^\s*[•·\-\s]*(日期|時間|現象|盤勢判斷|觀察類型|待驗證假設|操作事件|數字來源)\s*[：:]\s*(.*)$/);
      if (m) {
        var key = FIELD_MAP[m[1]];
        /* 同一個 key 再次出現 = 新的一筆（例如連續兩筆都從「時間：」開始） */
        if (cur && cur._raw[key] !== undefined && String(cur._raw[key]).trim() !== '') flush();
        if (!cur) cur = { _raw: {} };
        cur._raw[key] = m[2];
        lastKey = key;
      } else if (cur && lastKey && ln.trim()) {
        /* 沒有標籤的行 = 上一欄的續行（現象與假設常常換行） */
        cur._raw[lastKey] = String(cur._raw[lastKey] || '') + '\n' + ln.trim();
      }
    }
    flush();

    var out = recs.map(function (rc, idx) {
      var f = blank(), R = rc._raw, tagW = [];
      var n = '第 ' + (idx + 1) + ' 筆';
      if (R.date && /\d{4}-\d{2}-\d{2}/.test(R.date)) f.date = R.date.match(/\d{4}-\d{2}-\d{2}/)[0];
      if (R.timestamp) {
        var tm = String(R.timestamp).match(/(\d{1,2}):(\d{2})/);
        if (tm) f.timestamp = ('0' + tm[1]).slice(-2) + ':' + tm[2];
        else warn.push(n + '：時間「' + R.timestamp.trim() + '」認不得，維持現在時間');
      }
      f.observation = String(R.observation || '').trim();
      f.hypothesis = String(R.hypothesis || '').trim();
      if (R.bias) {
        var bv = String(R.bias).trim();
        if (BIAS.indexOf(bv) >= 0) f.bias = bv;
        else warn.push(n + '：盤勢判斷「' + bv + '」不是偏多／偏空／不明，維持「不明」');
      }
      if (R.tags) {
        String(R.tags).split(/[、,，\/／\s]+/).forEach(function (t) {
          t = t.trim(); if (!t) return;
          if (TAGS.indexOf(t) >= 0) { if (f.tags.indexOf(t) < 0) f.tags.push(t); }
          else tagW.push(t);
        });
        if (tagW.length) warn.push(n + '：觀察類型「' + tagW.join('、') + '」不在清單裡，已略過');
      }
      if (R.tradeType) {
        var tv = String(R.tradeType).trim();
        if (tv === '無' || tv === '') f.tradeType = '';
        else if (TRADE_TYPES.indexOf(tv) >= 0) f.tradeType = tv;
        else warn.push(n + '：操作事件「' + tv + '」不在清單裡，已留空');
      }
      if (R.source) {
        var sv = String(R.source).trim().replace(/[-─—–]/g, '－');
        if (SOURCES.indexOf(sv) >= 0) f.source = sv;
        else warn.push(n + '：數字來源「' + sv + '」不是五個合法值之一，已留空（存檔前請自己選）');
      } else {
        warn.push(n + '：沒有「數字來源」這一行，存檔前請自己選');
      }
      return f;
    });
    return { recs: out, warn: warn };
  }

  var TEMPLATE_TEXT = [

  ].join('\n');

  /* ---- 行情 snapshot：就地用 App 已載入的資料組，後端不重抓 ----
     拿不到的一律 null，不編造。dataAt 記快照時間，日後可辨識資料是否過期。 */
  function snapshot() {
    var out = {
      price: null, changePct: null, open: null, high: null, low: null, volume: null,
      avgPrice: null, ma5: null, ma20: null,
      marketIndexChangePct: null, futuresChangePct: null,
      groupUpCount: null, groupDownCount: null, groupFlatCount: null,
      groupSnapshot: [], groupPattern: '', relativeToGroup: '', dataAt: null
    };
    var mk = null, yg = null;
    try { mk = JSON.parse(localStorage.getItem('dl_market') || 'null'); } catch (e) {}
    try { yg = JSON.parse(localStorage.getItem('dl_ygdata') || 'null'); } catch (e) {}

    if (mk) {
      if (mk.t) out.dataAt = new Date(mk.t).toISOString();
      var q = mk['2327.TW'] || mk['2327'];
      if (q) {
        out.price = num(q.price);
        if (q.price != null && q.prevClose) out.changePct = Math.round((q.price / q.prevClose - 1) * 10000) / 100;
      }
      var tw = mk['^TWII'];
      if (tw && tw.price != null && tw.prevClose) {
        out.marketIndexChangePct = Math.round((tw.price / tw.prevClose - 1) * 10000) / 100;
      }
      /* 族群：沿用 App 既有清單，不 hard-code 第二份 */
      var syms = [];
      try { syms = JSON.parse(localStorage.getItem('dl_marketsyms') || '[]') || []; } catch (e) { syms = []; }
      var up = 0, dn = 0, fl = 0, snap = [];
      syms.forEach(function (it) {
        var sy = String(it.sym || '');
        if (!/\.TW$/.test(sy)) return;              /* 只取台股被動元件，日股與指數不計入家數 */
        if (sy === '^TWII') return;
        var qq = mk[sy];
        if (!qq || qq.price == null || !qq.prevClose) return;
        var pct = Math.round((qq.price / qq.prevClose - 1) * 10000) / 100;
        snap.push({ symbol: sy.replace('.TW', ''), name: it.name || '', changePct: pct });
        if (pct > 0) up++; else if (pct < 0) dn++; else fl++;
      });
      if (snap.length) {
        out.groupSnapshot = snap; out.groupUpCount = up; out.groupDownCount = dn; out.groupFlatCount = fl;
        if (out.changePct != null) {
          var better = snap.filter(function (x) { return x.changePct > out.changePct; }).length;
          out.relativeToGroup = better <= 2 ? '領先' : (better >= snap.length - 2 ? '落後' : '同步');
        }
      }
    }
    if (yg && yg.daily && yg.daily.length) {
      var d0 = yg.daily[0] || {};
      out.open = num(d0.open); out.high = num(d0.high); out.low = num(d0.low);
      out.volume = num(d0.vol); out.ma5 = num(d0.ma5); out.ma20 = num(d0.ma20);
      if (out.price == null) out.price = num(d0.close);
    }
    /* avgPrice：2327_intraday 是收盤後才跑的日誌，盤中沒有當日資料 → 維持 null，不硬湊 */
    return out;
  }

  function post(body, cb) {
    var s = st();
    if (!s.gasUrl) { msg = '尚未設定 GAS 網址。'; render(); return; }
    body.token = s.appToken || '';
    fetch(s.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(cb)
      .catch(function () { loading = false; msg = '連線失敗。'; render(); });
  }

  function load() {
    loading = true; render();
    post({ action: 'obsList' }, function (d) {
      loading = false;
      if (d && d.ok) {
        rows = (d.rows || []).map(function (r) { r.timestamp = normTime(r.timestamp); return r; });
        days = d.days || []; msg = '';
      }
      else { msg = (d && d.msg) || '讀取失敗（後端需 v4.53 以上）。'; }
      render();
    });
  }

  function save() {
    if (!form || !String(form.observation || '').trim()) { msg = '請先輸入觀察內容。'; render(); return; }
    /* ★v1.5：時間合理區間提示。台股 09:00–13:30，超出就先擋一次讓人確認。
       ⚠ 只提示【不阻擋】—— 盤後補記、盤前掛單觀察都是合法的。
         再按一次就放行，但至少會看見一眼。
       ⚠ 這一條防的是「裝置時鐘或時區跑掉」這種安靜的錯，不是防打錯字。 */
    var tmv = String(form.timestamp || '').match(/^(\d{1,2}):(\d{2})$/);
    if (tmv && !timeConfirmed) {
      var mins = Number(tmv[1]) * 60 + Number(tmv[2]);
      if (mins < 540 || mins > 810) {
        var gap = tzGapHr();
        msg = '⚠ ' + form.timestamp + ' 不在台股盤中時段（09:00–13:30）。'
            + (gap ? '你的裝置目前與台灣差 ' + gap + ' 小時，' : '')
            + '如果是盤後補記就再按一次「儲存觀察」。';
        timeConfirmed = true; render(); return;
      }
    }
    var row = {};
    /* 編輯既有筆時不覆蓋原始快照；補記非今日的觀察時也不附快照 ——
       快照抓的是「現在」的行情，拿它當 8/28 的證據會污染日後統計。
       寧可留白，也不要存一份看起來像證據、其實是別天的數字。 */
    var backdated = String(form.date) !== today();
    var snap = (form.id || backdated) ? {} : snapshot();
    if (backdated && !form.id) row.dataAt = '';
    Object.keys(snap).forEach(function (k) { row[k] = snap[k]; });
    ['id', 'date', 'timestamp', 'bias', 'observation', 'hypothesis',
     'tradeType', 'tradeSide', 'tradePrice', 'tradeQty', 'tradeNote',
     'resultStatus', 'resultNote', 'source'].forEach(function (k) { row[k] = form[k]; });
    row.tags = form.tags || [];
    row.symbol = '2327';
    loading = true; render();
    post({ action: 'obsSave', row: row }, function (d) {
      loading = false;
      if (d && d.ok) {
        editId = null; msg = ''; timeConfirmed = false;
        /* 一次貼上多筆時，存完自動帶出下一筆，不必再貼一次 */
        if (pasteQueue.length) { form = pasteQueue.shift(); msg = '已存。還有 ' + (pasteQueue.length + 1) + ' 筆待存。'; }
        else form = null;
        load();
      }
      else { msg = (d && d.msg) || '儲存失敗。'; render(); }
    });
  }

  function del(id) {
    if (!window.confirm('確定刪除這筆觀察？')) return;
    loading = true; render();
    post({ action: 'obsDelete', id: id }, function () { loading = false; load(); });
  }

  function chip(label, on, act, col) {
    return '<button data-act="' + act + '" style="flex:0 0 auto;padding:4px 9px;border-radius:8px;font-size:11.5px;'
      + 'cursor:pointer;border:1px solid ' + (on ? (col || C.y) : C.line) + ';'
      + 'background:' + (on ? 'rgba(232,163,61,.16)' : 'transparent') + ';'
      + 'color:' + (on ? (col || C.y) : C.m) + '">' + esc(label) + '</button>';
  }

  function formHtml() {
    var f = form;
    var h = '<div style="background:' + C.bg + ';border:1px solid ' + C.line + ';border-radius:10px;padding:10px;margin-bottom:10px">';
    h += '<div class="dl-row" style="margin-bottom:4px"><b style="font-size:12.5px">'
       + (f.id ? '編輯觀察' : '新增盤中觀察') + '</b>'
       + '<span style="font-size:11px;color:' + C.m + '">' + esc(f.timestamp) + '</span></div>';
    /* v1.2：日期與時間改為可輸入 —— 補記前幾日的觀察時，不能被迫記成今天。

      }
    }
    var bs = el.querySelectorAll('[data-act]');
    for (i = 0; i < bs.length; i++) {
      bs[i].onclick = (function (a) {
        return function () {
          var p = a.indexOf(':') >= 0 ? a.substring(0, a.indexOf(':')) : a;
          var v = a.indexOf(':') >= 0 ? a.substring(a.indexOf(':') + 1) : '';
          if (p === 'tab') { tab = v; }
          else if (p === 'new') { form = blank(); }
          else if (p === 'cancel') { form = null; editId = null; }
          else if (p === 'save') { save(); return; }
          else if (p === 'bias' && form) { form.bias = v; }
          else if (p === 'src' && form) { form.source = (form.source === v ? '' : v); }
          else if (p === 'paste') { pasteOpen = !pasteOpen; pasteMsg = ''; }
          else if (p === 'ptparse') {
            var pr = parsePaste(pasteText);
            if (!pr.recs.length) { pasteMsg = '⚠ 解析不出任何一筆。每筆至少要有「現象：」那一行。'; }
            else {
              form = pr.recs[0];
              pasteQueue = pr.recs.slice(1);
              pasteOpen = false; pasteText = '';
              pasteMsg = '解析到 ' + pr.recs.length + ' 筆'
                       + (pr.warn.length ? '｜⚠ ' + pr.warn.join('｜') : '｜全部欄位都認得');
            }
          }
          else if (p === 'ptclear') { pasteText = ''; pasteMsg = ''; pasteQueue = []; }
          else if (p === 'copytpl') {
            var ta = document.createElement('textarea');
            ta.value = TEMPLATE_TEXT;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { pasteMsg = document.execCommand('copy') ? '已複製模板，貼給 ChatGPT。' : '複製失敗，請長按下方文字自行選取。'; }
            catch (e) { pasteMsg = '複製失敗，請長按下方文字自行選取。'; }
            document.body.removeChild(ta);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              try { navigator.clipboard.writeText(TEMPLATE_TEXT); pasteMsg = '已複製模板，貼給 ChatGPT。'; } catch (e2) {}
            }
          }
          else if (p === 'res' && form) { form.resultStatus = v; }
          else if (p === 'tag' && form) {
            var ix = form.tags.indexOf(v);
            if (ix >= 0) form.tags.splice(ix, 1); else form.tags.push(v);
          }
          else if (p === 'ftag') { filterTag = v; }
          else if (p === 'day') { openDay[v] = !openDay[v]; }
          else if (p === 'edit') {
            var r = rows.filter(function (x) { return String(x.id) === v; })[0];
            if (r) {
              form = {
                id: r.id, date: r.date, timestamp: r.timestamp || '',
                bias: r.bias || '不明', tags: Array.isArray(r.tags) ? r.tags.slice() : [],
                observation: r.observation || '', hypothesis: r.hypothesis || '',
                tradeType: r.tradeType || '', tradeSide: r.tradeSide || '',
                tradePrice: r.tradePrice || '', tradeQty: r.tradeQty || '', tradeNote: r.tradeNote || '',
                resultStatus: r.resultStatus || '待驗證', resultNote: r.resultNote || '',
                source: r.source || ''
              };
            }
          }
          else if (p === 'del') { del(v); return; }
          render();
        };
      })(bs[i].getAttribute('data-act'));
    }
  }

  window.ygObsReload_ = load;
  var mounted = false;
  setInterval(function () {
    var el = document.getElementById('ygobs-mount');
    if (!el) { mounted = false; return; }
    if (!mounted) { mounted = true; if (!rows.length) load(); else render(); }
    else if (!el.innerHTML) render();
  }, 700);
})();
</script>

<!-- 交易檢討 v1（App 4.80）。獨立 script。
     只問三個可統計的問題：進場理由是否成立／出場是計畫內或臨時／若不動結果如何。
     第三項由後端自動算，畫面上不可編輯 —— 它是客觀對照，不能被事後合理化。 -->
<script>
(function () {
  var HELD = ['成立', '不成立', '無法判定'];
  var PLAN = ['計畫內', '臨時起意', '停損停利觸發'];
  var C = { g: '#3ecf8e', r: '#ff5b5b', y: '#e8a33d', m: '#93a4c0', line: '#26324a', bg: '#131c2c' };
  var rows = [], stats = null, loading = false, msg = '', form = null, showPick = false;

  function st() { try { return JSON.parse(localStorage.getItem('dl_settings') || '{}') || {}; } catch (e) { return {}; } }
  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function n2(v) { var n = Number(v); return isFinite(n) ? n : null; }

  function post(body, cb) {
    var s = st();
    if (!s.gasUrl) { msg = '尚未設定 GAS 網址。'; loading = false; render(); return; }
    body.token = s.appToken || '';
    fetch(s.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(cb)
      .catch(function () { loading = false; msg = '連線失敗。'; render(); });
  }
  function load() {
    loading = true; render();
    post({ action: 'reviewList' }, function (d) {
      loading = false;
      if (d && d.ok) { rows = d.rows || []; stats = d.stats || null; msg = ''; }
      else { msg = (d && d.msg) || '讀取失敗（後端需 v4.54 以上）。'; }
      render();
    });
  }

  /* 已平倉部位：從 App 既有的 dl_stocks 讀，不另建一份交易資料 */
  function closedTrades() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('dl_stocks') || '[]') || []; } catch (e) { list = []; }
    var out = [];
    list.forEach(function (r) {
      var sells = [];
      try { sells = typeof r.sells === 'string' ? (JSON.parse(r.sells || '[]') || []) : (r.sells || []); } catch (e) { sells = []; }
      if (!sells.length) return;
      var shares = n2(r.shares) || 0;
      var sold = sells.reduce(function (a, x) { return a + (n2(x.shares) || 0); }, 0);
      if (!shares || sold < shares) return;                 /* 只列全部平倉的 */
      var amt = sells.reduce(function (a, x) { return a + (n2(x.shares) || 0) * (n2(x.price) || 0); }, 0);
      var avgExit = sold ? Math.round(amt / sold * 100) / 100 : null;
      var last = sells[sells.length - 1] || {};
      out.push({
        stockId: r.id || '', symbol: String(r.symbol || ''), name: r.name || '',
        tradeType: r.tradeType || '', buyDate: r.buyDate || '',
        sellDate: String(last.date || '').substring(0, 10),
        entryPrice: n2(r.costPerShare), exitPrice: avgExit, qty: sold,
        entryReason: r.buyReasons || '', invalidation: r.invalid || ''
      });
    });
    return out;
  }

  function chip(label, on, act, col) {
    return '<button data-act="' + act + '" style="flex:0 0 auto;padding:4px 9px;border-radius:8px;font-size:11.5px;'
      + 'cursor:pointer;border:1px solid ' + (on ? (col || C.y) : C.line) + ';'
      + 'background:' + (on ? 'rgba(232,163,61,.16)' : 'transparent') + ';color:' + (on ? (col || C.y) : C.m) + '">'
      + esc(label) + '</button>';
  }

  function formHtml() {
    var f = form;
    var h = '<div style="background:' + C.bg + ';border:1px solid ' + C.line + ';border-radius:10px;padding:10px;margin-bottom:10px">';
    h += '<div class="dl-row" style="margin-bottom:6px"><b style="font-size:12.5px">'
       + (f.id ? '編輯檢討' : '新增檢討') + '</b><span style="font-size:11px;color:' + C.m + '">'
       + esc(f.symbol) + ' ' + esc(f.tradeType || '') + '</span></div>';
    h += '<div style="font-size:11px;color:' + C.m + ';line-height:1.7;margin-bottom:7px">'
       + '進場 ' + esc(f.entryPrice) + '　出場 ' + esc(f.exitPrice) + '　' + esc(f.qty) + ' 股<br>'
       + esc(f.buyDate) + ' → ' + esc(f.sellDate) + '</div>';

    if (f.entryReason || f.invalidation) {
      h += '<div style="background:#111a29;border-radius:7px;padding:6px 8px;margin-bottom:8px;font-size:11.5px;color:#9fb2cc;line-height:1.6">'
         + (f.entryReason ? '當時理由：' + esc(f.entryReason) + '<br>' : '')
         + (f.invalidation ? '失效條件：' + esc(f.invalidation) : '') + '</div>';
    }

    h += '<div style="font-size:11px;color:' + C.m + ';margin-bottom:3px">① 進場理由是否成立</div>';
    h += '<div style="display:flex;gap:6px;margin-bottom:8px">';
    HELD.forEach(function (x) {
      var col = x === '成立' ? C.g : (x === '不成立' ? C.r : C.m);
      h += chip(x, f.reasonHeld === x, 'held:' + x, col);
    });
    h += '</div>';

    h += '<div style="font-size:11px;color:' + C.m + ';margin-bottom:3px">② 出場是計畫內或臨時起意</div>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
    PLAN.forEach(function (x) { h += chip(x, f.exitPlanned === x, 'plan:' + x); });
    h += '</div>';

    h += '<div style="font-size:11px;color:' + C.m + ';margin-bottom:3px">③ 若不動，結果會如何（程式自動計算，不可編輯）</div>';
    h += '<div style="background:#111a29;border-radius:7px;padding:6px 8px;margin-bottom:8px;font-size:11.5px;color:#8fa3bd">'
       + (f.id ? esc(f.cfNote || '（儲存後由後端計算）') : '儲存後由後端依日線自動計算') + '</div>';

    h += '<textarea data-f="lesson" rows="3" placeholder="這次學到什麼（選填）" '
       + 'style="width:100%;box-sizing:border-box;background:#0e1624;border:1px solid ' + C.line + ';border-radius:8px;'
       + 'color:#e8eef6;font-size:12.5px;padding:7px;margin-bottom:8px">' + esc(f.lesson || '') + '</textarea>';

    h += '<div style="display:flex;gap:7px">'
       + '<button data-act="save" style="flex:1;padding:9px;border-radius:9px;border:none;background:' + C.y + ';color:#1a1200;font-weight:800;font-size:13px;cursor:pointer">'
       + (loading ? '儲存中…' : '儲存檢討') + '</button>'
       + '<button data-act="cancel" style="flex:0 0 auto;padding:9px 12px;border-radius:9px;border:1px solid ' + C.line + ';background:transparent;color:' + C.m + ';font-size:12.5px;cursor:pointer">取消</button>'
       + '</div></div>';
    return h;
  }

  function render() {
    var el = document.getElementById('ygrev-mount');
    if (!el) return;
    var h = '<div class="dl-card">';
    h += '<div class="dl-row" style="margin-bottom:8px"><div style="font-size:14px;font-weight:800">交易檢討</div>'
       + '<span style="font-size:11px;color:' + C.m + '">' + rows.length + ' 筆</span></div>';
    if (msg) h += '<p class="dl-note" style="color:#e0a75e;margin:0 0 7px">' + esc(msg) + '</p>';

    if (stats && stats.cfN) {
      h += '<div style="background:#141d2e;border-left:3px solid ' + C.y + ';border-radius:7px;padding:7px 9px;margin-bottom:9px;font-size:11.5px;line-height:1.7;color:#e8eef6">'
         + '反事實樣本 ' + stats.cfN + ' 筆：提前出場較有利 ' + stats.exitBetterCount + ' 次（' + stats.exitBetterPct + '%）<br>'
         + '<span style="color:' + C.m + '">平均「不動」相對已出場 ' + (stats.cfAvgDelta >= 0 ? '+' : '') + stats.cfAvgDelta + '%'
         + '　樣本數少時僅供參考</span></div>';
    }

    if (form) h += formHtml();
    else {
      h += '<button data-act="pick" style="width:100%;padding:9px;border-radius:9px;border:1px dashed ' + C.line
         + ';background:transparent;color:' + C.y + ';font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:10px">＋ 從已平倉部位新增檢討</button>';
      if (showPick) {
        var cands = closedTrades();
        var done = {}; rows.forEach(function (r) { if (r.stockId) done[r.stockId] = 1; });
        h += '<div style="background:' + C.bg + ';border:1px solid ' + C.line + ';border-radius:10px;padding:9px;margin-bottom:10px">';
        if (!cands.length) h += '<p class="dl-note" style="margin:0">沒有已全部平倉的部位。</p>';
        cands.forEach(function (c, ix) {
          h += '<button data-act="new:' + ix + '" style="display:block;width:100%;text-align:left;padding:7px;margin-bottom:5px;'
             + 'border-radius:8px;border:1px solid ' + C.line + ';background:transparent;color:#e8eef6;font-size:12px;cursor:pointer">'
             + esc(c.symbol) + ' ' + esc(c.tradeType) + '　' + esc(c.entryPrice) + ' → ' + esc(c.exitPrice)
             + '　<span style="color:' + C.m + '">' + esc(c.sellDate) + (done[c.stockId] ? '　已檢討' : '') + '</span></button>';
        });
        h += '</div>';
      }
    }

    if (loading && !rows.length) h += '<p class="dl-note" style="margin:0">載入中…</p>';
    if (!rows.length && !loading) h += '<p class="dl-note" style="margin:0">還沒有檢討紀錄。</p>';

    rows.forEach(function (r) {
      var hc = r.reasonHeld === '成立' ? C.g : (r.reasonHeld === '不成立' ? C.r : C.m);
      var cd = Number(r.cfDelta);
      h += '<div style="border-left:2px solid ' + hc + ';padding-left:9px;margin-bottom:12px">';
      h += '<div style="font-size:11.5px;color:' + C.m + '">' + esc(r.sellDate || '') + '　'
         + esc(r.symbol) + ' ' + esc(r.tradeType || '') + '</div>';
      h += '<div style="font-size:12.5px;color:#e8eef6;margin:2px 0">'
         + esc(r.entryPrice) + ' → ' + esc(r.exitPrice) + '　' + esc(r.qty) + ' 股'
         + '　<span style="color:' + hc + ';font-weight:700">理由' + esc(r.reasonHeld || '未填') + '</span>'
         + '　<span style="color:' + C.m + '">' + esc(r.exitPlanned || '') + '</span></div>';
      if (r.cfNote) {
        h += '<div style="font-size:11px;color:' + (isFinite(cd) && cd < 0 ? C.g : C.y) + ';margin:2px 0">'
           + '若不動：' + esc(r.cfNote) + '</div>';
      }
      if (r.lesson) h += '<div style="font-size:11.5px;color:#9fb2cc;line-height:1.6;margin:3px 0">' + esc(r.lesson) + '</div>';
      h += '<div style="display:flex;gap:6px;margin-top:4px">'
         + '<button data-act="edit:' + esc(r.id) + '" style="padding:3px 9px;border-radius:7px;border:1px solid ' + C.line + ';background:transparent;color:' + C.m + ';font-size:11px;cursor:pointer">編輯</button>'
         + '<button data-act="del:' + esc(r.id) + '" style="padding:3px 9px;border-radius:7px;border:1px solid ' + C.line + ';background:transparent;color:#c96a6a;font-size:11px;cursor:pointer">刪除</button>'
         + '</div></div>';
    });

    h += '<p class="dl-note" style="margin:8px 0 0;font-size:10px;color:#5d7089">'
       + '「若不動」由日線自動對照，不可人工編輯 —— 它是用來檢驗提前出場的價值，不是拿來合理化決策的。</p>';
    h += '</div>';
    el.innerHTML = h;

    var ins = el.querySelectorAll('[data-f]'), i;
    for (i = 0; i < ins.length; i++) {
      ins[i].oninput = (function (nd) { return function () { if (form) form[nd.getAttribute('data-f')] = nd.value; }; })(ins[i]);
    }
    var bs = el.querySelectorAll('[data-act]');
    for (i = 0; i < bs.length; i++) {
      bs[i].onclick = (function (a) {
        return function () {
          var p = a.indexOf(':') >= 0 ? a.substring(0, a.indexOf(':')) : a;
          var v = a.indexOf(':') >= 0 ? a.substring(a.indexOf(':') + 1) : '';
          if (p === 'pick') { showPick = !showPick; }
          else if (p === 'new') {
            var c = closedTrades()[Number(v)];
            if (c) { form = JSON.parse(JSON.stringify(c)); form.id = ''; form.reasonHeld = ''; form.exitPlanned = ''; form.lesson = ''; showPick = false; }
          }
          else if (p === 'cancel') { form = null; }
          else if (p === 'held' && form) { form.reasonHeld = v; }
          else if (p === 'plan' && form) { form.exitPlanned = v; }
          else if (p === 'edit') { var r = rows.filter(function (x) { return String(x.id) === v; })[0]; if (r) form = JSON.parse(JSON.stringify(r)); }
          else if (p === 'del') {
            if (!window.confirm('確定刪除這筆檢討？')) return;
            loading = true; render();
            post({ action: 'reviewDelete', id: v }, function () { loading = false; load(); });
            return;
          }
          else if (p === 'save') {
            if (!form) return;
            loading = true; render();
            post({ action: 'reviewSave', row: form }, function (d) {
              loading = false;
              if (d && d.ok) { form = null; msg = ''; load(); }
              else { msg = (d && d.msg) || '儲存失敗。'; render(); }
            });
            return;
          }
          render();
        };
      })(bs[i].getAttribute('data-act'));
    }
  }

  window.ygRevReload_ = load;
  var mounted = false;
  setInterval(function () {
    var el = document.getElementById('ygrev-mount');
    if (!el) { mounted = false; return; }
    if (!mounted) { mounted = true; if (!rows.length) load(); else render(); }
    else if (!el.innerHTML) render();
  }, 700);
})();
</script>

<!-- 交易類型獲利分析（App 4.81）。掛在「檢討」tab 底部。
     ★所有損益一律取自 window.__YG_POS__ 的 calc（Mc/McShort 的輸出），
       這裡不做任何損益計算 —— 重算一定會跟卡片上的數字對不起來。 -->
<script>
(function () {
  var C = { g: '#3ecf8e', r: '#ff5b5b', y: '#e8a33d', m: '#93a4c0', line: '#26324a' };

  function typeOf(p) {
    /* 當沖優先：它同時是現股，但決策性質完全不同，混在現股裡就看不出來了 */
    var raw = p || {};
    var c = raw.calc || {};
    /* ★ tradeType 的實際值是 cash / margin / short / day —— 當沖是 'day'。
       先前漏判這個值，12 筆全落到現股/融資/融券，當沖那類根本不出現。 */
    var tt = String(raw.tradeType || '');
    if (tt === 'day' || raw.dayTrade || raw.isDayTrade
        || (raw.daySellPrice != null && raw.daySellPrice !== '')) return '當沖';
    if (tt === 'short' || c.isShort) return '融券';
    if (tt === 'margin' || c.isMargin) return '融資';
    return '現股';
  }
  /* App 5.02 C64：已實現彙總表要標交易類型，掛到 window 給 bundle 用。
     ★不要在別處另寫一支分類器 —— tradeType 的 'day' 已經漏判過一次
     （12 筆全落到現股/融資/融券，當沖那類根本不出現）。只能有這一支。 */
  window.ygTypeOf_ = typeOf;

  function stats() {
    var pos = [];
    try { pos = window.__YG_POS__ || []; } catch (e) { pos = []; }
    var g = {};
    pos.forEach(function (p) {
      var c = p.calc || {};
      var r = Number(c.realized);
      /* 只統計已實現的部分：未平倉的浮動損益會隨行情跳動，混進來無法比較 */
      if (!isFinite(r) || (!c.closed && !(Number(c.soldShares) > 0))) return;
      var k = typeOf(p);
      if (!g[k]) g[k] = { k: k, n: 0, sum: 0, win: 0, loss: 0, best: null, worst: null, pcts: [], cost: 0 };
      var o = g[k];
      o.n++; o.sum += r;
      /* 成本＝手續費+交易稅+借券費+利息。當沖筆數多、單筆報酬薄，成本佔比才是它可不可行的關鍵。 */
      ['realizedFees', 'realizedTax', 'realizedInterest', 'borrowFee'].forEach(function (fk) {
        var fv = Math.abs(Number(c[fk]));
        if (isFinite(fv)) o.cost += fv;
      });
      if (r > 0) o.win++; else if (r < 0) o.loss++;
      if (o.best == null || r > o.best) o.best = r;
      if (o.worst == null || r < o.worst) o.worst = r;
      var pc = Number(c.realizedPct);
      if (isFinite(pc)) o.pcts.push(pc);
    });
    return ['現股', '融資', '融券', '當沖'].map(function (k) { return g[k]; })
      .filter(function (x) { return x; });
  }

  function fmt(v) {
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return (n >= 0 ? '+' : '') + Math.round(n).toLocaleString();
  }

  function render() {
    var el = document.getElementById('ygpnl-mount');
    if (!el) return;
    var g = stats();
    var h = '<div class="dl-card">';
    h += '<div class="dl-row" style="margin-bottom:8px"><div style="font-size:14px;font-weight:800">交易類型獲利分析</div>'
       + '<span style="font-size:10.5px;color:' + C.m + '">已實現</span></div>';

    if (!g.length) {
      h += '<p class="dl-note" style="margin:0">還沒有已實現的交易，或請先開啟「台股」頁載入部位。</p></div>';
      el.innerHTML = h; return;
    }
    var tot = g.reduce(function (a, x) { return a + x.sum; }, 0);
    var totN = g.reduce(function (a, x) { return a + x.n; }, 0);

    /* App 4.94：10 欄的表格在手機上一定要左右滑，滑出去的那幾欄等於看不到。
       改成一型一塊、由上而下 —— 同樣的十個數字，不必橫向捲動。
       ⚠ 數字一個都沒少，只是換排法；損益仍取自部位卡片的同一套計算。 */
    function cell(lab, val, col) {
      return '<div style="min-width:0">'
           + '<div style="font-size:10px;color:' + C.m + '">' + lab + '</div>'
           + '<div style="font-size:12.5px;font-weight:700;color:' + (col || '#e8eef6') + '">' + val + '</div>'
           + '</div>';
    }
    h += '<div style="display:flex;flex-direction:column;gap:9px">';
    g.forEach(function (x) {
      var wr = x.n ? Math.round(x.win / x.n * 1000) / 10 : null;
      var col = x.sum >= 0 ? C.r : C.g;
      var cpRatio = (x.cost && x.sum > 0) ? (Math.round(x.cost / x.sum * 1000) / 10) : null;
      var cpCol = (cpRatio != null && cpRatio > 15) ? C.y : '#e8eef6';
      h += '<div style="border-left:2px solid ' + col + ';padding:0 0 0 9px">'
         + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">'
         + '<span style="font-size:14px;font-weight:800">' + x.k + '</span>'
         + '<span style="font-size:15px;font-weight:800;color:' + col + '">' + fmt(x.sum) + '</span>'
         + '</div>'
         + '<div style="font-size:11px;color:' + C.m + ';margin:1px 0 5px">'
         + x.n + ' 筆　' + x.win + ' 勝 ' + x.loss + ' 敗　勝率 ' + (wr == null ? '—' : wr + '%')
         + '</div>'
         + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px 6px">'
         + cell('平均/筆', fmt(x.sum / x.n), col)
         + cell('成本', x.cost ? Math.round(x.cost).toLocaleString() : '—')
         + cell('成本佔比', cpRatio == null ? '—' : cpRatio + '%', cpCol)
         + cell('最佳', fmt(x.best), C.r)
         /* ★C35（4.97）「最差」只在為負時顯示。
            全勝的分類會出現綠色的「最差 +112,623」，每次都要停下來確認正負 ——
            它不是計算錯誤（最差＝最差的一筆，不是虧損），但視覺上讀起來像 bug。
            ⚠ 代價講明：融券 2 筆全勝時，隱藏後只看得到最佳，看不出兩筆分布多窄。
              使用者 2026-08-31 明確選了「正值隱藏」而不是改標籤，這是他的取捨不是我的。
            ⚠ 只有 1 筆時 worst === best，本來就沒有資訊，正負都不必再列。
            ★★4.99 修版面：4.97 把這一格拆到 grid 外面另起一個 div，結果多吐一個
              </div>，每一型都少關一層，紅色左邊框整個錯位、最差跑到框外。
              現在放回同一個 grid —— 四欄自動換行，第五格落在第二列第一欄，
              不必為了條件顯示多開一個容器。DOM 少一層，結構就少一個會壞的地方。 */
         + ((x.worst < 0 && x.n > 1) ? cell('最差', fmt(x.worst), C.g) : '')
         + '</div>'
         + '</div>';
    });
    h += '<div style="border-top:1px solid ' + C.line + ';padding-top:8px;display:flex;'
       + 'align-items:baseline;justify-content:space-between">'
       + '<span style="font-size:13px;font-weight:800">合計　<span style="font-size:11px;color:'
       + C.m + ';font-weight:400">' + totN + ' 筆</span></span>'
       + '<span style="text-align:right">'
       + '<span style="font-size:16px;font-weight:800;color:' + (tot >= 0 ? C.r : C.g) + '">' + fmt(tot) + '</span>'
       + '<span style="display:block;font-size:10.5px;color:' + C.m + '">平均/筆 ' + fmt(tot / (totN || 1)) + '</span>'
       + '</span></div>';
    h += '</div>';

    /* 樣本量守門：筆數太少就不要下結論，否則「當沖不可行」會是雜訊 */
    var thin = g.filter(function (x) { return x.n < 10; });
    if (thin.length) {
      h += '<p class="dl-note" style="margin:8px 0 0;font-size:10.5px;color:#e0a75e;line-height:1.6">⚠ '
         + thin.map(function (x) { return x.k + '（' + x.n + ' 筆）'; }).join('、')
         + ' 樣本不足 10 筆，勝率與平均值波動很大，還不足以判斷這個交易方式可不可行。</p>';
    }
    h += '<p class="dl-note" style="margin:6px 0 0;font-size:10px;color:#5d7089;line-height:1.6">'
       + '損益取自部位卡片的同一套計算（含手續費、交易稅、借券費、利息），此處不另行計算。'
       + '當沖與現股分開列：當沖同時也是現股，但決策性質不同，合併就看不出差異。<br>'
       + '成本佔比＝（手續費+交易稅+借券費+利息）÷ 總損益。超過 15% 標黃 —— '
       + '當沖真正的風險不在勝率，而在單筆報酬薄、成本佔比高。</p>';
    h += '</div>';
    el.innerHTML = h;
  }

  var last = '';
  setInterval(function () {
    var el = document.getElementById('ygpnl-mount');
    if (!el) return;
    var sig = '';
    try { sig = String((window.__YG_POS__ || []).length) + '|' + (el.innerHTML ? '1' : '0'); } catch (e) {}
    if (sig !== last) { last = sig; render(); }
  }, 800);
})();
</script>

</body>
</html>
