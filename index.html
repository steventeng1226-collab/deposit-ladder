* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.dl-app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0e1420; color: #e6ebf2;
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", system-ui, sans-serif; padding-bottom: 72px; }
.dl-app :is(input,button){ font-family: inherit; }
.dl-muted { color: #a6b3c6; }
.dl-row { display: flex; align-items: center; justify-content: space-between; }
.dl-unit { font-size: 10px; color: #8a97ab; margin-left: 2px; font-weight: 400; }

.dl-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: #0e1420ee; backdrop-filter: blur(8px); border-bottom: 1px solid #1c2740; }
.dl-title { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
.dl-ver { font-size: 10px; font-weight: 600; color: #6f7f96; margin-left: 6px; vertical-align: middle; }

.dl-txfwarn { margin-top: 4px; font-size: 11px; color: #e8a33d; line-height: 1.5; }

/* v3.64 header \u5E38\u99D0\u5FEB\u6377 */
.dl-titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dl-quick { display: flex; gap: 4px; }
/* v3.65\uFF1A\u4E09\u500B\u90FD\u5E38\u99D0\u91D1\u6A58\u7C97\u9AD4\u3002\u539F\u672C\u7528\u5B57\u8272\u5340\u5206\u9078\u4E2D\uFF0C\u6539\u6210\u91D1\u8272\u5F8C\u5B57\u8272\u4E0D\u80FD\u518D\u517C\u4EFB\u72C0\u614B\uFF0C
   \u9078\u4E2D\u6539\u7531\u5E95\u8272\uFF0B\u908A\u6846\u8868\u793A\uFF08\u5B57\u8272\u4E09\u500B\u4E00\u81F4\uFF0C\u624D\u4E0D\u6703\u6709\u300C\u54EA\u500B\u662F\u53EF\u6309\u7684\u300D\u9019\u7A2E\u8AA4\u8B80\uFF09\u3002 */
.dl-qb { background: #16203a; color: #d4a544; border: 1px solid #23324f; border-radius: 999px;
  padding: 3px 9px; font-size: 11px; font-weight: 800; }
.dl-qb.on { background: #3a2c12; border-color: #d4a544; }

.dl-mkgsub { display: block; font-size: 10px; font-weight: 600; color: #6c7d97; margin-top: 2px; }

.dl-mnh { font-size: 12.5px; font-weight: 800; color: #d4a544; margin-top: 10px; }

/* v3.75 \u5206\u9805\u547D\u4E2D\u7387\u9577\u689D */
.dl-barbg { position: relative; height: 8px; background: #16203a; border-radius: 4px; overflow: hidden; }
.dl-barfill { height: 100%; border-radius: 4px; }
.dl-barbase { position: absolute; top: -2px; width: 1px; height: 12px; background: #9fb2cc; }

/* v3.71 \u76E4\u524D\u65B9\u5411\u7D00\u9304 */
.dl-predstat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
  background: #101a2c; border: 1px solid #1e2b45; border-radius: 10px; padding: 9px 11px; }

/* v3.71 \u5206\u6790\u6298\u758A */
.dl-secwrap { margin-top: 4px; }
.dl-sec { border: 1px solid #1e2b45; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
.dl-sech { width: 100%; display: flex; align-items: center; gap: 7px; background: #131d33;
  color: #d4a544; border: none; padding: 9px 11px; font-size: 13px; font-weight: 800; font-family: inherit; }
.dl-sech.on { background: #17223b; border-bottom: 1px solid #1e2b45; }
.dl-secar { color: #7f92ad; font-size: 11px; }
.dl-seccnt { color: #6c7d97; font-size: 10.5px; font-weight: 600; }
.dl-secb { padding: 9px 11px 3px; }
.dl-secall { background: #16203a; color: #9fb2cc; border: 1px solid #23324f; border-radius: 999px;
  padding: 3px 9px; font-size: 10.5px; font-weight: 700; }

/* v3.65b \u4ECA\u65E5\u5206\u6790\u8FFD\u554F */
.dl-anachat { margin-top: 10px; border-top: 1px solid #1e2b45; padding-top: 10px; }
