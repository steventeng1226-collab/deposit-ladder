.dl-divform .dl-ghost, .dl-divform .dl-primary { padding: 8px 14px; font-size: 13px; }

.dl-mergewrap { margin-bottom: 6px; }
.dl-mergehd { font-size: 12px; font-weight: 700; color: #9fb0c9; margin: 2px 2px 8px; letter-spacing: .3px; }
.dl-merge { border-color: #2a3a5c; background: linear-gradient(160deg,#141d30,#141b29); }
.dl-mgtag { font-size: 10px; font-weight: 700; color: #b9c6da; background: #23324e; border-radius: 5px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

.dl-alert { cursor: pointer; border-color: #4a3350; background: linear-gradient(160deg,#221a2a,#1a1622); }
.dl-alert.danger { border-color: #5a2740; background: linear-gradient(160deg,#2a1620,#1c1420); }
.dl-alert.good { border-color: #22503a; background: linear-gradient(160deg,#12271d,#141b29); }
.dl-alert.watch { border-color: #4a4322; background: linear-gradient(160deg,#231f10,#1a1a12); }
.dl-alertbadge { display: inline-block; min-width: 18px; text-align: center; font-size: 11px; font-weight: 800; color: #201700; background: #d4a544; border-radius: 10px; padding: 0 6px; margin-left: 4px; }
.dl-alertrow.watch { color: #e6d08a; }
.dl-alertfoot { font-size: 10.5px; color: #7688a3; padding-top: 8px; margin-top: 4px; border-top: 1px solid #2a2336; }
.dl-alerthd { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: #e6d0a0; margin-bottom: 8px; }
.dl-alertrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 6px 0; border-top: 1px solid #2a2336; font-variant-numeric: tabular-nums; }
.dl-alertrow:first-of-type { border-top: none; }
.dl-alertrow.stop { color: #f2a3b6; } .dl-alertrow.profit { color: #8fe3b8; }
.dl-alertrow b { color: #e6ebf2; }

.dl-reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.dl-reason { background: #0f1826; border: 1px solid #26324c; color: #b9c6da; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
.dl-reason.on { background: #1e3350; border-color: #3a6ea5; color: #cfe3ff; }
.dl-reasonchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.dl-rchip { font-size: 11px; background: #12271d; border: 1px solid #22503a; color: #8fe3b8; border-radius: 20px; padding: 2px 9px; }
.dl-imtag { font-size: 10px; font-weight: 700; color: #f2a3b6; background: #2a1620; border: 1px solid #5a2740; border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.dl-sellbtn { width: 100%; background: #2a1c10; border: 1px solid #6b4a2a; color: #e6b84a; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.dl-sellform { background: #0f1826; border: 1px solid #3a2a4a; border-radius: 12px; padding: 12px; margin-top: 10px; }
.dl-selllist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dl-realwrap { margin-top: 6px; }
.dl-realcard { background: linear-gradient(160deg,#14201a,#141b22); border-color: #274233; }
.dl-watchwrap { margin-bottom: 6px; }

.dl-ovcard { padding: 0; overflow: hidden; }
.dl-ovhd { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 11px; color: #7688a3; letter-spacing: .3px; border-bottom: 1px solid #212c44; }
.dl-ovitem { border-top: 1px solid #1a2336; }
.dl-ovitem:first-of-type { border-top: none; }
.dl-ovrow { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
.dl-ovrow:active { background: #131b2a; }
.dl-ovno { width: 20px; color: #8a97ab; font-weight: 700; font-variant-numeric: tabular-nums; }
.dl-ovdate { width: 90px; font-variant-numeric: tabular-nums; }
.dl-ovamt { flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
.dl-ovrate { width: 46px; text-align: right; color: #3ecf8e; font-variant-numeric: tabular-nums; }
.dl-ovterm { width: 40px; text-align: right; color: #d4a544; font-weight: 700; }
.dl-ovchev { width: 12px; text-align: right; color: #5b6b84; transition: transform .15s ease; }
.dl-ovchev.open { transform: rotate(90deg); color: #d4a544; }
.dl-ovdetail { padding: 4px 14px 14px; background: #0f1826; }
.dl-ovdetail .dl-row { padding: 5px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.dl-ovdetail .dl-row span { color: #8a97ab; }
